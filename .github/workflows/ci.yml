name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.6
      - run: biome ci .
      # The Dockerfile corepack pin must match the `packageManager` field in
      # package.json, or the runtime image resolves a different pnpm than the
      # one the project is built and tested against. Fail fast on drift.
      - name: Verify Dockerfile corepack pin matches packageManager
        run: bash scripts/verify-toolchain.sh check_corepack_pin
      # The Dockerfile node image must satisfy the `engines.node` range in
      # package.json, or the runtime image runs a Node major the project does
      # not declare support for. Fail fast on drift.
      - name: Verify Dockerfile node image satisfies engines.node
        run: bash scripts/verify-toolchain.sh check_node_image
      # The tsconfig `target` must be supported by the declared TypeScript
      # version, or the build fails with an unsupported-target error. Fail fast
      # on drift (e.g. bumping target to ES2024 while TS is pinned below 5.5).
      - name: Verify TypeScript version supports tsconfig target
        run: bash scripts/verify-toolchain.sh check_ts_target
      # CI must test on the same Node major the runtime image uses, and that
      # major must satisfy engines.node — otherwise tests pass on a Node the
      # deployed app doesn't actually run. Fail fast on any drift.
      - name: Verify CI setup-node versions match Dockerfile and engines.node
        run: bash scripts/verify-toolchain.sh check_setup_node
      # pnpm/action-setup installs the pnpm version from `packageManager` by
      # default. A hardcoded `version:` input would make CI run a different
      # pnpm than the declared toolchain. Fail fast on any drift.
      - name: Verify pnpm/action-setup version input matches packageManager
        run: bash scripts/verify-toolchain.sh check_pnpm_action_setup

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No cache: this job never runs `pnpm install`, so the pnpm store
      # path doesn't exist and the cache-save post-step fails the run with
      # "Path Validation Error". `pnpm audit` works fine without it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm audit --audit-level=high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const summary = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8'),
            )
            const total = summary.total
            const pct = (metric) => {
              const value = total[metric]
              return `${value.pct.toFixed(2)}% (${value.covered}/${value.total})`
            }
            const body = [
              '## 📊 Test coverage',
              '',
              '| Metric | Coverage |',
              '| --- | --- |',
              `| Statements | ${pct('statements')} |`,
              `| Branches | ${pct('branches')} |`,
              `| Functions | ${pct('functions')} |`,
              `| Lines | ${pct('lines')} |`,
              '<!-- coverage-comment -->',
            ].join('\n')

            // Posting is best-effort: PR tokens are read-only in some repos,
            // so a 403 here must not fail the job. Coverage enforcement already
            // happens in the `pnpm test:coverage` step above.
            try {
              const { owner, repo } = context.repo
              const issueNumber = context.issue.number

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNumber,
              })
              const existing = comments.find(
                (comment) =>
                  comment.body && comment.body.includes('<!-- coverage-comment -->'),
              )

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                })
              }
            } catch (error) {
              core.warning(
                `Could not post coverage comment: ${error instanceof Error ? error.message : String(error)}`,
              )
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
