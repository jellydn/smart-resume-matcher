name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.6
      - run: biome ci .
      # The Dockerfile corepack pin must match the `packageManager` field in
      # package.json, or the runtime image resolves a different pnpm than the
      # one the project is built and tested against. Fail fast on drift.
      - name: Verify Dockerfile corepack pin matches packageManager
        run: |
          declared=$(grep -Eo '"packageManager"[^,]*' package.json | sed -E 's/.*"([^"]+)".*/\1/' | cut -d'+' -f1)
          pinned=$(grep -Eo 'corepack prepare [^ ]+ --activate' Dockerfile | awk '{print $3}')
          if [ -z "$pinned" ]; then
            echo "::error::Could not find a 'corepack prepare pnpm@X --activate' pin in Dockerfile"
            exit 1
          fi
          if [ "$declared" != "$pinned" ]; then
            echo "::error::Dockerfile corepack pin '$pinned' does not match packageManager '$declared'. Keep them in sync."
            exit 1
          fi
          echo "✓ Dockerfile corepack pin ($pinned) matches packageManager ($declared)"
      # The Dockerfile node image must satisfy the `engines.node` range in
      # package.json, or the runtime image runs a Node major the project does
      # not declare support for. Fail fast on drift.
      - name: Verify Dockerfile node image satisfies engines.node
        run: |
          image_major=$(grep -Eo 'FROM node:[0-9]+' Dockerfile | head -1 | grep -Eo '[0-9]+')
          range=$(grep -Eo '"node": *"[^"]*"' package.json | sed -E 's/.*"([^"]*)"/\1/')
          if [ -z "$image_major" ]; then
            echo "::error::Could not find a 'FROM node:<major>-alpine' base image in Dockerfile"
            exit 1
          fi
          # Support the common '>=X' ranges; anything else is treated as a
          # mismatch so the check stays conservative.
          if ! echo "$range" | grep -Eq '^>=[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Unsupported engines.node range '$range'. Only '>=X' ranges are supported by this check."
            exit 1
          fi
          min_major=$(echo "$range" | sed -E 's/^>=([0-9]+).*/\1/')
          if [ "$image_major" -lt "$min_major" ]; then
            echo "::error::Dockerfile node image (node:${image_major}-alpine) does not satisfy engines.node '$range' in package.json"
            exit 1
          fi
          echo "✓ Dockerfile node image (node:${image_major}-alpine) satisfies engines.node ($range)"
      # The tsconfig `target` must be supported by the declared TypeScript
      # version, or the build fails with an unsupported-target error. Fail fast
      # on drift (e.g. bumping target to ES2024 while TS is pinned below 5.5).
      - name: Verify TypeScript version supports tsconfig target
        run: |
          ts_ver=$(grep -Eo '"typescript": *"[^"]*"' package.json | sed -E 's/.*"([^"]*)".*/\1/')
          target=$(grep -Eo '"target": *"[^"]*"' tsconfig.json | sed -E 's/.*"([^"]*)".*/\1/')
          if [ -z "$ts_ver" ] || [ -z "$target" ]; then
            echo "::error::Could not read typescript version from package.json or target from tsconfig.json"
            exit 1
          fi
          # Strip common range prefixes (^ ~ >=) to get the bare version.
          ts_ver=$(echo "$ts_ver" | sed -E 's/^(\^|~|>=)+//')
          ts_major=$(echo "$ts_ver" | cut -d. -f1)
          ts_minor=$(echo "$ts_ver" | cut -d. -f2)
          # Minimum TypeScript version that supports each target (from the
          # TypeScript release notes): ES2022=4.6, ES2023=5.2, ES2024=5.5.
          case "$target" in
            ES2024) req_major=5; req_minor=5 ;;
            ES2023) req_major=5; req_minor=2 ;;
            ES2022) req_major=4; req_minor=6 ;;
            ESNext|ES2021|ES2020|ES2019|ES2018|ES2017|ES2016|ES2015|ES6|ES5|ES3) req_major=0; req_minor=0 ;;
            *) echo "::error::Unsupported tsconfig target '$target'. Update this check or use a known target."; exit 1 ;;
          esac
          if [ "$ts_major" -lt "$req_major" ] || { [ "$ts_major" -eq "$req_major" ] && [ "$ts_minor" -lt "$req_minor" ]; }; then
            echo "::error::TypeScript $ts_ver does not support tsconfig target '$target' (requires >=$req_major.$req_minor)"
            exit 1
          fi
          echo "✓ TypeScript $ts_ver supports tsconfig target ($target)"
      # CI must test on the same Node major the runtime image uses, and that
      # major must satisfy engines.node — otherwise tests pass on a Node the
      # deployed app doesn't actually run. Fail fast on any drift.
      - name: Verify CI setup-node versions match Dockerfile and engines.node
        run: |
          ci_versions=""
          while IFS= read -r v; do
            v=$(echo "$v" | sed -E 's/node-version: *"([^"]*)"/\1/')
            ci_versions="$ci_versions $v"
          done < <(grep -Eo 'node-version: *"[^"]*"' .github/workflows/ci.yml)

          image_major=$(grep -Eo 'FROM node:[0-9]+' Dockerfile | head -1 | grep -Eo '[0-9]+')
          range=$(grep -Eo '"node": *"[^"]*"' package.json | sed -E 's/.*"([^"]*)"/\1/')

          if [ -z "${ci_versions// /}" ]; then
            echo "::error::No node-version found in the CI workflow's setup-node steps"
            exit 1
          fi
          if [ -z "$image_major" ]; then
            echo "::error::Could not find a 'FROM node:<major>' base image in Dockerfile"
            exit 1
          fi
          if ! echo "$range" | grep -Eq '^>=[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Unsupported engines.node range '$range'. Only '>=X' ranges are supported by this check."
            exit 1
          fi
          min_major=$(echo "$range" | sed -E 's/^>=([0-9]+).*/\1/')

          failed=0
          for v in $ci_versions; do
            v_major=$(echo "$v" | cut -d. -f1)
            if [ "$v_major" != "$image_major" ]; then
              echo "::error::CI setup-node version '$v' (major $v_major) does not match Dockerfile node image (node:${image_major}-alpine)"
              failed=1
            fi
            if [ "$v_major" -lt "$min_major" ]; then
              echo "::error::CI setup-node version '$v' (major $v_major) does not satisfy engines.node '$range' in package.json"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "✓ All CI setup-node versions ($ci_versions) match Dockerfile node:${image_major}-alpine and satisfy engines.node ($range)"

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # No cache: this job never runs `pnpm install`, so the pnpm store
      # path doesn't exist and the cache-save post-step fails the run with
      # "Path Validation Error". `pnpm audit` works fine without it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: pnpm audit --audit-level=high

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Report coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const summary = JSON.parse(
              fs.readFileSync('coverage/coverage-summary.json', 'utf8'),
            )
            const total = summary.total
            const pct = (metric) => {
              const value = total[metric]
              return `${value.pct.toFixed(2)}% (${value.covered}/${value.total})`
            }
            const body = [
              '## 📊 Test coverage',
              '',
              '| Metric | Coverage |',
              '| --- | --- |',
              `| Statements | ${pct('statements')} |`,
              `| Branches | ${pct('branches')} |`,
              `| Functions | ${pct('functions')} |`,
              `| Lines | ${pct('lines')} |`,
              '<!-- coverage-comment -->',
            ].join('\n')

            // Posting is best-effort: PR tokens are read-only in some repos,
            // so a 403 here must not fail the job. Coverage enforcement already
            // happens in the `pnpm test:coverage` step above.
            try {
              const { owner, repo } = context.repo
              const issueNumber = context.issue.number

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNumber,
              })
              const existing = comments.find(
                (comment) =>
                  comment.body && comment.body.includes('<!-- coverage-comment -->'),
              )

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                })
              }
            } catch (error) {
              core.warning(
                `Could not post coverage comment: ${error instanceof Error ? error.message : String(error)}`,
              )
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
