name: Deploy to Dokku

on:
  push:
    branches: ["main"]

# Guard against the concurrent-push race observed when two merges land back-to-back:
# two deploy runs pushing to the Dokku remote at once caused one to fail with
# "cannot lock ref 'refs/heads/master': is at <a> but expected <b>". Serialize deploys
# per ref and never cancel a push already in flight (a mid-push cancel could leave the
# remote ref in a bad state); older queued runs are dropped, so only the latest lands.
concurrency:
  group: deploy-dokku-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Dokku
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight secrets check
        env:
          HAS_GIT_REMOTE_URL: ${{ secrets.DOKKU_GIT_REMOTE_URL != '' }}
          HAS_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY != '' }}
          HAS_SSH_HOST_KEY: ${{ secrets.DOKKU_SSH_HOST_KEY != '' }}
        run: |
          echo "Checking required deployment secrets..."
          FAILED=0
          if [ "$HAS_GIT_REMOTE_URL" = "true" ]; then
            echo "✓ DOKKU_GIT_REMOTE_URL is configured"
          else
            echo "::error::DOKKU_GIT_REMOTE_URL repository secret is missing or empty"
            FAILED=1
          fi

          if [ "$HAS_SSH_PRIVATE_KEY" = "true" ]; then
            echo "✓ DOKKU_SSH_PRIVATE_KEY is configured"
          else
            echo "::error::DOKKU_SSH_PRIVATE_KEY repository secret is missing or empty"
            FAILED=1
          fi

          if [ "$HAS_SSH_HOST_KEY" = "true" ]; then
            echo "✓ DOKKU_SSH_HOST_KEY is configured"
          else
            echo "::warning::DOKKU_SSH_HOST_KEY repository secret is not set"
          fi

          if [ $FAILED -ne 0 ]; then
            exit 1
          fi

      - name: Deploy to Dokku
        uses: dokku/github-action@cc7dec1d2b9fed249a14ae462bc953bba436f78c # v1.10.0
        with:
          # The Dokku app's deploy branch is `main` (dokku git:set ... deploy-branch main),
          # but the action defaults to pushing `master`, which updates the ref without
          # triggering a build. Push to `main` so the deploy actually runs.
          branch: main
          # Dokku's `main` ref was seeded with an old deploy-setup commit that is not
          # in our history, so a plain push is non-fast-forward; the deploy branch is
          # just a deployment marker, so force-pushing is safe and documented.
          git_push_flags: --force
          git_remote_url: ${{ secrets.DOKKU_GIT_REMOTE_URL }}
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          ssh_host_key: ${{ secrets.DOKKU_SSH_HOST_KEY }}
          trace: ${{ secrets.DOKKU_TRACE || 'false' }}

